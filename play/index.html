<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - Pay Point Play</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: black; color: #FFFF00; font-family: Arial, sans-serif; text-align: center; padding: 20px; margin: 0; overflow-x: hidden; }
        #qrContainer { background: white; padding: 20px; display: inline-block; border-radius: 10px; margin-top: 10px; }
        .plays-text { font-size: 2.5em; font-weight: 900; margin: 20px 0; color: #FFFF00; }
        #loading-screen { margin-top: 100px; font-size: 1.5em; color: #FFFF00; font-weight: bold; }
        #main-content { display: none; }
        
        /* THE ORIGINAL FULL-SCREEN OVERLAY */
        #full-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            cursor: pointer;
        }
        .overlay-card {
            background: #FFFF00;
            color: black;
            padding: 40px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.5em;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(255, 255, 0, 0.4);
        }
    </style>
</head>
<body>

    <div id="full-overlay" style="display: none;">
        <div class="overlay-card">
            CLICK TO REVEAL<br>& DOWNLOAD QR
        </div>
    </div>

    <div id="loading-screen">VERIFYING PAYMENT...</div>

    <div id="main-content">
        <h1 style="font-size: 2.5em; font-weight: 900; margin-bottom: 0;">SUCCESSFUL!</h1>
        <div class="plays-text"><span id="plays-count">...</span> PLAYS LOADED</div>
        
        <div id="qrContainer">
            <div id="qrcode"></div>
        </div>

        <div style="margin-top: 25px; color: white; font-weight: bold; font-size: 1.2em;">
            SECRET CODE: <span id="code-text" style="color: #FFFF00;">...</span>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjaGbQwD5teEFye6ne9XT9LWw7IsMDBNcbuh1TX--3LlyRKwSrj_mDSC2en7zlqyMe/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        const recoveryMid = localStorage.getItem('ppp_attempted_machine');

        async function startFlow() {
            if (!sessionId && !recoveryMid) {
                const savedQR = localStorage.getItem('last_paid_qr');
                const savedPlays = localStorage.getItem('last_paid_plays');
                if (savedQR) displayQR(savedQR, savedPlays);
                else document.getElementById('loading-screen').textContent = "NO RECENT PURCHASE FOUND.";
                return;
            }

            try {
                const query = sessionId ? `session_id=${sessionId}` : `recovery_mid=${recoveryMid}`;
                const response = await fetch(`${APPS_SCRIPT_URL}?${query}`);
                const data = await response.json();

                if (data.qr_code) {
                    localStorage.setItem('last_paid_qr', data.qr_code);
                    localStorage.setItem('last_paid_plays', data.plays);
                    displayQR(data.qr_code, data.plays);
                } else {
                    setTimeout(startFlow, 3000);
                }
            } catch (err) { setTimeout(startFlow, 5000); }
        }

        function displayQR(qrText, plays) {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('code-text').textContent = qrText;
            document.getElementById('plays-count').textContent = plays || "1";

            const qrDiv = document.getElementById("qrcode");
            qrDiv.innerHTML = "";
            new QRCode(qrDiv, { 
                text: qrText, 
                width: 280, 
                height: 280, 
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H 
            });

            // HANDLE THE OVERLAY DISPLAY
            const overlay = document.getElementById('full-overlay');
            const alreadyDone = sessionStorage.getItem('viewed_' + qrText);
            
            if (!alreadyDone) {
                overlay.style.display = 'flex';
                overlay.onclick = function() {
                    triggerBrandedDownload(qrText, plays);
                    sessionStorage.setItem('viewed_' + qrText, 'true');
                    overlay.style.display = 'none';
                };
            }
        }

        function triggerBrandedDownload(text, plays) {
            const canvas = document.createElement('canvas');
            canvas.width = 440; canvas.height = 520;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'white'; ctx.fillRect(0, 0, 440, 520);
            
            const qrCanvas = document.querySelector('#qrcode canvas');
            if (qrCanvas) ctx.drawImage(qrCanvas, 40, 40, 360, 360);
            
            ctx.fillStyle = 'black';
            ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center';
            ctx.fillText(text, 220, 450);
            
            ctx.font = '20px Arial';
            ctx.fillText(plays + " PLAYS LOADED", 220, 485);
            
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = `PayPointPlay-${plays}Plays.png`;
            a.click();
        }

        startFlow();
    </script>
</body>
</html>
