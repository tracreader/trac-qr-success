<script>
    const urlParams = new URLSearchParams(window.location.search);
    const incomingMid = urlParams.get('mid'); // Looks for ?mid=0243-xxxxxxxx
    let realMachineId = 'unknown';

    if (incomingMid) {
        // Find the hyphen. Even if they delete half the dummy string, 
        // as long as the "0243-" part is there, we win.
        const hyphenIndex = incomingMid.indexOf('-');
        realMachineId = hyphenIndex > 0 ? incomingMid.substring(0, hyphenIndex) : incomingMid;
        
        // LOCK it into the phone's brain immediately
        localStorage.setItem('current_machine_id', realMachineId);

        // CLEAN THE URL: This removes the ?mid= part so they can't mess with it
        const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
    } else {
        // If they refresh without a URL, pull from the phone's brain
        realMachineId = localStorage.getItem('current_machine_id') || 'unknown';
    }

    const machineSpan = document.getElementById('machine-id');
    if (realMachineId === 'unknown') {
        machineSpan.textContent = '---';
        document.querySelectorAll('.buy-btn').forEach(btn => btn.classList.add('disabled'));
        document.getElementById('no-machine').style.display = 'block';
        document.getElementById('machine-info').style.display = 'none';
        document.getElementById('selection-header').style.display = 'none';
        document.getElementById('lost-btn').style.display = 'none';
    } else {
        machineSpan.textContent = realMachineId;
        document.querySelectorAll('.buy-btn').forEach(btn => {
            // Attach the clean ID to the Stripe link
            const url = new URL(btn.href);
            url.searchParams.set('client_reference_id', realMachineId);
            btn.href = url.toString();
            
            // Handshake Safety Net
            btn.onclick = function() {
                localStorage.setItem('ppp_attempted_machine', realMachineId);
                localStorage.setItem('ppp_attempted_time', Date.now());
            };
        });
    }
</script>
