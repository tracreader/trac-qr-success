<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pay Point Play</title>
  <style>
    body { 
      background: black; 
      color: #FFFF00; 
      font-family: Arial, sans-serif; 
      text-align: center; 
      padding: 20px; 
      margin: 0; 
      overflow-x: hidden;
    }
    
    h1 { 
      font-size: 10vw; 
      margin: 20px 0; 
      font-weight: 900; 
      white-space: nowrap;
    }

    /* Hand-tuned font sizes for precise vertical alignment */
    #machine-info { 
      margin-bottom: 25px; 
      display: inline-block; 
      text-align: left;
    }
    .label-text { 
      font-size: 2.32em; /* Aligns 'O' and 'N' with 'M' and '3' below */
      font-weight: 900; 
      color: #FFFFFF; 
      display: block; 
      line-height: 1;
      letter-spacing: -0.5px;
    }
    .id-text { 
      font-size: 2.5em; 
      font-weight: 900; 
      color: #FFFF00; 
      display: block;
      margin-top: -2px;
    }

    #selection-header { 
      margin: 25px 0 15px 0; 
      display: inline-block; 
      text-align: left;
    }
    h2 { 
      font-size: 2.58em; /* Aligns margins for Select Plays line */
      margin: 0; 
      font-weight: 900; 
      color: #FFFF00; 
      display: block;
      line-height: 1;
    }
    .fee { 
      font-size: 1.25em; 
      color: #FFFF99; 
      font-weight: bold; 
      display: block;
      text-align: center;
      margin-top: 5px;
    }

    .buttons { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    
    .buy-btn, .lost-btn { 
      display: block; 
      margin: 10px 0; 
      padding: 22px; 
      background: #FFFF00; 
      color: black; 
      font-size: 2em; 
      font-weight: 900; 
      text-transform: uppercase; 
      text-decoration: none; 
      border-radius: 15px; 
      width: 90%; 
      max-width: 500px; 
      box-sizing: border-box;
      transition: transform 0.1s;
    }

    .buy-btn:active { transform: scale(0.98); }
    
    .buy-btn.disabled { 
      background: #444; 
      color: #777; 
      pointer-events: none; 
    }
    
    .lost-btn { 
      background: #222; 
      color: #FFFF00; 
      border: 4px solid #FFFF00; 
      margin-top: 30px;
    }

    #no-machine { 
      font-size: 1.8em; 
      font-weight: bold; 
      margin: 40px 0; 
      color: #FF0000; 
    }

    @media (min-width: 600px) { h1 { font-size: 3.5em; } }
  </style>
</head>
<body>

  <h1>PAY! POINT! PLAY!</h1>

  <div id="machine-info">
    <span class="label-text">ONLY WORKS ON</span>
    <span class="id-text">MACHINE: <span id="machine-id">...</span></span>
  </div>

  <div id="no-machine" style="display:none;">PLEASE SCAN MACHINE<br>QR CODE TO PLAY!</div>

  <div id="selection-header">
    <h2>SELECT PLAY(S):</h2>
    <div class="fee">+$0.39 MOBILE PROCESSING FEE</div>
  </div>

  <div class="buttons">
    <a id="btn1" class="buy-btn" href="https://buy.stripe.com/test_9B63cn7i6b8vbwh7QefMA01">1 PLAY ($1.39)</a>
    <a id="btn3" class="buy-btn" href="https://buy.stripe.com/test_14A8wH6e2a4r9o92vUfMA03">3 PLAYS ($3.39)</a>
    <a id="btn5" class="buy-btn" href="https://buy.stripe.com/test_6oUeV5aui1xV0RD1rQfMA00">5 PLAYS ($5.39)</a>
    <a id="btn10" class="buy-btn" href="https://buy.stripe.com/test_28EbITbym0tR2ZL7QefMA04">10 PLAYS ($10.39)</a>
    
    <a id="lost-btn" class="lost-btn" href="https://tracreader.github.io/trac-qr-success/">LOST QR CODE? CLICK TO FETCH</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const obfuscatedMid = urlParams.get('mid');
    let realMachineId = 'unknown';

    // 1. Resolve Machine ID
    if (obfuscatedMid) {
      const hyphenIndex = obfuscatedMid.indexOf('-');
      realMachineId = hyphenIndex > 0 ? obfuscatedMid.substring(0, hyphenIndex) : obfuscatedMid;
      localStorage.setItem('ppp_current_mid', realMachineId);
    } else {
      realMachineId = localStorage.getItem('ppp_current_mid') || 'unknown';
    }

    const machineSpan = document.getElementById('machine-id');
    
    if (realMachineId === 'unknown') {
      machineSpan.textContent = '---';
      document.querySelectorAll('.buy-btn').forEach(btn => btn.classList.add('disabled'));
      document.getElementById('no-machine').style.display = 'block';
      document.getElementById('machine-info').style.display = 'none';
      document.getElementById('selection-header').style.display = 'none';
      document.getElementById('lost-btn').style.display = 'none';
    } else {
      machineSpan.textContent = realMachineId;
      
      // 2. Prepare Buttons & Memory Handshake
      document.querySelectorAll('.buy-btn').forEach(btn => {
        // Update Stripe Link with Machine ID
        const url = new URL(btn.href);
        url.searchParams.set('client_reference_id', realMachineId);
        btn.href = url.toString();
        
        // Save to memory when clicked
        btn.onclick = function() {
            localStorage.setItem('ppp_active_machine', realMachineId);
            localStorage.setItem('ppp_timestamp', Date.now());
        };
      });
    }

    // 3. Clean URL for a professional look
    if (obfuscatedMid) {
      const cleanUrl = window.location.pathname;
      window.history.replaceState({}, document.title, cleanUrl);
    }
  </script>
</body>
</html>
