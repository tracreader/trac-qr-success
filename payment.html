<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Point Play</title>
  <style>
    body { background: black; color: #FFFF00; font-family: Arial, sans-serif; text-align: center; padding: 20px; margin: 0; }
    h1 { font-size: 10vw; margin: 20px 0; font-weight: 900; white-space: nowrap; }

    #machine-info { margin-bottom: 25px; display: inline-block; text-align: left; }
    .label-text { font-size: 2.32em; font-weight: 900; color: #FFFFFF; display: block; line-height: 0.9; }
    .id-text { font-size: 2.5em; font-weight: 900; color: #FFFF00; display: block; }

    #selection-header { margin: 25px 0 15px 0; display: inline-block; text-align: left; }
    h2 { font-size: 2.58em; margin: 0; font-weight: 900; color: #FFFF00; display: block; line-height: 0.9; }
    .fee { font-size: 1.25em; color: #FFFF99; font-weight: bold; display: block; text-align: center; }

    .buttons { display: flex; flex-direction: column; align-items: center; }
    .buy-btn, .lost-btn { 
      display: block; margin: 10px 0; padding: 22px; background: #FFFF00; color: black; 
      font-size: 2em; font-weight: 900; text-transform: uppercase; text-decoration: none; 
      border-radius: 15px; width: 90%; max-width: 500px; box-sizing: border-box;
    }
    .lost-btn { background: #222; color: #FFFF00; border: 4px solid #FFFF00; margin-top: 30px; }
    @media (min-width: 600px) { h1 { font-size: 3.5em; } }
  </style>
</head>
<body>
  <h1>PAY! POINT! PLAY!</h1>
  <div id="machine-info">
    <span class="label-text">ONLY WORKS ON</span>
    <span class="id-text">MACHINE: <span id="machine-id">...</span></span>
  </div>

  <div id="selection-header">
    <h2>SELECT PLAY(S):</h2>
    <div class="fee">+$0.39 MOBILE PROCESSING FEE</div>
  </div>

  <div class="buttons">
    <a id="btn1" class="buy-btn" href="https://buy.stripe.com/test_9B63cn7i6b8vbwh7QefMA01">1 PLAY ($1.39)</a>
    <a id="btn3" class="buy-btn" href="https://buy.stripe.com/test_14A8wH6e2a4r9o92vUfMA03">3 PLAYS ($3.39)</a>
    <a id="btn5" class="buy-btn" href="https://buy.stripe.com/test_6oUeV5aui1xV0RD1rQfMA00">5 PLAYS ($5.39)</a>
    <a id="btn10" class="buy-btn" href="https://buy.stripe.com/test_28EbITbym0tR2ZL7QefMA04">10 PLAYS ($10.39)</a>
    <a id="lost-btn" class="lost-btn" href="https://tracreader.github.io/trac-qr-success/">LOST QR CODE? CLICK TO FETCH</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const obfuscatedMid = urlParams.get('mid');
    let realMachineId = 'unknown';

    if (obfuscatedMid) {
      realMachineId = obfuscatedMid.split('-')[0];
      localStorage.setItem('ppp_current_mid', realMachineId);
    } else {
      realMachineId = localStorage.getItem('ppp_current_mid') || 'unknown';
    }

    const machineSpan = document.getElementById('machine-id');
    if (realMachineId !== 'unknown') {
      machineSpan.textContent = realMachineId;
      document.querySelectorAll('.buy-btn').forEach(btn => {
        const url = new URL(btn.href);
        url.searchParams.set('client_reference_id', realMachineId);
        btn.href = url.toString();
        
        // THE HANDSHAKE: Save memory before leaving for Stripe
        btn.onclick = function() {
          localStorage.setItem('ppp_active_machine', realMachineId);
          localStorage.setItem('ppp_timestamp', Date.now());
        };
      });
    }

    if (obfuscatedMid) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  </script>
</body>
</html>
