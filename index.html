<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjaGbQwD5teEFye6ne9XT9LWw7IsMDBNcbuh1TX--3LlyRKwSrj_mDSC2en7zlqyMe/exec";

    const urlParams = new URLSearchParams(window.location.search);
    let sessionId = urlParams.get('session_id') || localStorage.getItem('ppp_last_session');
    const recoveryMid = localStorage.getItem('ppp_attempted_machine');

    async function startFlow() {
        if (urlParams.get('session_id')) localStorage.setItem('ppp_last_session', urlParams.get('session_id'));
        document.getElementById('loading-screen').style.display = 'block';

        try {
            const query = sessionId ? `session_id=${sessionId}` : `recovery_mid=${recoveryMid}`;
            const response = await fetch(`${APPS_SCRIPT_URL}?${query}`);
            const data = await response.json();

            if (data.qr_code) {
                // 1. Setup the UI
                document.getElementById('code').textContent = data.qr_code;
                new QRCode(document.getElementById("qrContainer"), { 
                    text: data.qr_code, width: 280, height: 280, correctLevel: QRCode.CorrectLevel.H 
                });
                
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('main-content').style.visibility = 'visible';
                
                // 2. RESTORE: Foggy Overlay & Reveal Logic
                const alreadyDone = sessionStorage.getItem('done_' + (sessionId || recoveryMid));
                if (!alreadyDone) {
                    document.getElementById('overlay').style.display = 'flex';
                    document.getElementById('overlay').onclick = function() {
                        triggerDownload(data.qr_code, data.plays);
                        sessionStorage.setItem('done_' + (sessionId || recoveryMid), 'true');
                        this.remove();
                    };
                }
            } else { setTimeout(startFlow, 3000); }
        } catch (err) { setTimeout(startFlow, 4000); }
    }

    // 3. RESTORE: The Branded Canvas Download
    function triggerDownload(text, plays) {
        const canvas = document.createElement('canvas');
        canvas.width = 440; canvas.height = 520;
        const ctx = canvas.getContext('2d');
        
        // Draw the white card
        ctx.fillStyle = 'white'; ctx.fillRect(0, 0, 440, 520);
        
        // Draw your QR Code
        const qrCanvas = document.querySelector('#qrContainer canvas');
        if (qrCanvas) ctx.drawImage(qrCanvas, 40, 40, 360, 360);
        
        // Draw your proprietary text
        ctx.fillStyle = 'black'; 
        ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center';
        ctx.fillText(text, 220, 450);
        
        // Draw the Play Count
        ctx.font = '20px Arial';
        ctx.fillText(plays + " PLAYS LOADED", 220, 485);
        
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `PayPointPlay-${plays}Plays-${Math.floor(1000 + Math.random()*9000)}.png`;
        a.click();
    }
    startFlow();
</script>
