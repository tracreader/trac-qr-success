<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success - Pay Point Play</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: black; color: #FFFF00; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        #qrContainer { background: white; padding: 20px; display: inline-block; margin-top: 20px; border-radius: 10px; }
        .info { margin-top: 20px; font-size: 1.2em; color: white; }
        .plays-text { font-size: 2em; font-weight: bold; margin: 10px 0; color: #FFFF00; }
        #loading-screen { margin-top: 100px; font-size: 1.5em; }
        #main-content { display: none; }
    </style>
</head>
<body>

    <div id="loading-screen">Verifying Payment...</div>

    <div id="main-content">
        <h1>PAYMENT SUCCESSFUL!</h1>
        <div class="plays-text"><span id="plays-count">...</span> PLAYS LOADED</div>
        <div id="qrContainer"></div>
        <div class="info">
            <strong>CODE:</strong> <span id="code-text">...</span><br>
            <p>Scan this at the machine to play.</p>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjaGbQwD5teEFye6ne9XT9LWw7IsMDBNcbuh1TX--3LlyRKwSrj_mDSC2en7zlqyMe/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        const recoveryMid = localStorage.getItem('ppp_attempted_machine');

        async function startFlow() {
            // 1. If we have no session and no handshake, check for a PREVIOUSly saved QR
            if (!sessionId && !recoveryMid) {
                const savedQR = localStorage.getItem('last_paid_qr');
                const savedPlays = localStorage.getItem('last_paid_plays');
                
                if (savedQR) {
                    displayQR(savedQR, savedPlays);
                } else {
                    document.getElementById('loading-screen').innerHTML = "No recent purchase found.<br>Please scan a machine QR to start.";
                }
                return;
            }

            // 2. Otherwise, look for the NEW payment in the Google Sheet
            try {
                const query = sessionId ? `session_id=${sessionId}` : `recovery_mid=${recoveryMid}`;
                const response = await fetch(`${APPS_SCRIPT_URL}?${query}`);
                const data = await response.json();

                if (data.qr_code) {
                    // SAVE IT: This overrides the old one and stays on the phone
                    localStorage.setItem('last_paid_qr', data.qr_code);
                    localStorage.setItem('last_paid_plays', data.plays);
                    
                    displayQR(data.qr_code, data.plays);
                } else {
                    // Not in sheet yet? Wait 3 seconds and try again
                    setTimeout(startFlow, 3000);
                }
            } catch (err) {
                console.error("Fetch error:", err);
                setTimeout(startFlow, 5000);
            }
        }

        function displayQR(qrText, plays) {
            // Hide loading, show content
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';

            // Set text
            document.getElementById('code-text').textContent = qrText;
            document.getElementById('plays-count').textContent = plays || "?";

            // Clear old QR and generate new one
            document.getElementById('qrContainer').innerHTML = "";
            new QRCode(document.getElementById("qrContainer"), {
                text: qrText,
                width: 256,
                height: 256,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // Run on load
        startFlow();
    </script>
</body>
</html>
