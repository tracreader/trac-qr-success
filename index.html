<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <style>
        body { background: black; color: #FFFF00; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        #status { font-size: 1.5em; margin: 20px 0; color: #FFFFFF; }
        #qr-container { margin-top: 30px; display: none; }
        img { width: 80%; max-width: 300px; border: 10px solid white; border-radius: 10px; }
        .plays-text { font-size: 2em; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PAYMENT SUCCESS!</h1>
        <div id="status">Verifying your purchase...</div>
        
        <div id="qr-container">
            <div id="qr-image"></div>
            <div class="plays-text"><span id="play-count">0</span> PLAYS ADDED!</div>
            <p style="color: #FFFFFF;">Point this QR code at the machine camera to start.</p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSorcGIsmXLNmE0uYI1hFniGNKQIYCEeBgb7u3u_fcHGusZ-6xRJMtYpEkeKbhjYlh/exec"; // PASTE YOUR URL HERE

        async function checkPayment() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');
            
            // Check Handshake Memory
            const rememberedMachine = localStorage.getItem('ppp_active_machine');
            const rememberedTime = localStorage.getItem('ppp_timestamp');
            const isRecent = rememberedTime && (Date.now() - rememberedTime < 600000); // 10 min window

            let fetchUrl = SCRIPT_URL;

            if (sessionId) {
                fetchUrl += "?session_id=" + sessionId;
            } else if (rememberedMachine && isRecent) {
                // The "Black Hole" Recovery Path
                fetchUrl += "?recovery_mid=" + rememberedMachine;
            } else {
                document.getElementById('status').textContent = "Please return to the main page and click 'LOST QR'.";
                return;
            }

            try {
                const response = await fetch(fetchUrl);
                const data = await response.json();

                if (data.qr_code) {
                    document.getElementById('status').style.display = 'none';
                    document.getElementById('qr-container').style.display = 'block';
                    document.getElementById('qr-image').innerHTML = `<img src="${data.qr_code}" alt="QR Code">`;
                    document.getElementById('play-count').textContent = data.plays;
                    
                    // Clear memory
                    localStorage.removeItem('ppp_active_machine');
                    localStorage.removeItem('ppp_timestamp');
                } else {
                    document.getElementById('status').textContent = "Payment found, but QR is generating... please wait.";
                    setTimeout(checkPayment, 3000); // Retry every 3 seconds
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('status').textContent = "Connecting to server...";
                setTimeout(checkPayment, 4000);
            }
        }

        // Start the check
        checkPayment();
    </script>
</body>
</html>
